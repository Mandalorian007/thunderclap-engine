# Two jobs on every push and pull request: `check` (typecheck, lint, import boundaries, WGSL and bundle budgets, unit tests) and `e2e` (Playwright, Chromium; the webkit-ipad project runs on macOS only, so here by hand as `e2e-webkit`). No secrets are used or needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    # Engine platform e2e (D-041 addendum 2, a gate): the harness smoke on the viewport/device/iframe
    # matrix in playwright.config.ts. Headless Chromium gets WebGPU from SwiftShader on Linux (the
    # flags are in the config). GitHub sets CI=true, which means 1 worker, 1 retry and the HTML
    # report. In last-rune the same suite ran in the Playwright container on arm64; if SwiftShader
    # loses the WebGPU device here ("A valid external Instance reference no longer exists"), that
    # is the fix to try.
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-webkit:
    # The webkit-ipad project (playwright.config.ts, D2 §2 R1) on a macOS runner: the engine's
    # iPad target. Run by hand (workflow_dispatch) and non-blocking until it proves stable on a VM
    # GPU; the local release gate (`pnpm release` runs `pnpm test:e2e` on a Mac) is the real gate.
    name: e2e (webkit-ipad)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm exec playwright test --project webkit-ipad
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    # Unsigned desktop builds of the harness shell (packages/host-electron), one per OS.
    # Non-blocking. Build-time downloads only (Electron, packaging tools); no signing material.
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  pack:
    # The npm packages as a stranger installs them (E-037): `pnpm build`, `pnpm pack` of the engine
    # and the three hosts, a tarball audit, then a typecheck and Vite build of a fresh project
    # outside the workspace that installs the tarballs (scripts/pack-smoke.mjs).
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pack
