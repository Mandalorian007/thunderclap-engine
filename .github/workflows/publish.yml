# Publish to npm on a version tag (E-037). `pnpm release <version> --tag` makes the tag and
# prints the push command; pushing the tag runs this workflow.
#
# Trusted publishing: npm trusts this workflow file through OIDC (`id-token: write`), so no token
# or secret exists anywhere. Each package needs a trusted publisher on npmjs.com pointing at
# Mandalorian007/thunderclap-engine and publish.yml (docs/releasing.md). Provenance is attached.
#
# A package whose exact version is already on npm is skipped, so a tag that bumps only the engine
# still succeeds; bump a host's own package.json version to publish it.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:pack

      - name: Publish
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tarballs"
          mkdir -p "$out"
          for dir in . packages/host-capacitor packages/host-electron packages/host-pwa; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            # pnpm pack applies publishConfig (dist/ exports) and rewrites workspace: ranges;
            # npm publishes that tarball with provenance over OIDC.
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$out" | tail -n 1)
            npm publish "$tarball" --access public --provenance
            echo "published $name@$version"
          done
