<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ThunderClap engine harness: XR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #root { position: fixed; inset: 0; }
      #enter-vr {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        padding: 10px 18px; font: 16px system-ui, sans-serif; border-radius: 8px;
        border: 1px solid #888; background: #1a1a1a; color: #eee; cursor: pointer;
      }
      #enter-vr:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <button id="enter-vr" type="button" disabled>Enter VR</button>
    <script type="module" src="./xr.ts"></script>
  </body>
</html>
