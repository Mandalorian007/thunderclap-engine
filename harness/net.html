<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ThunderClap engine net harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font: 14px system-ui, sans-serif; }
      #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 6px 12px; background: #111c; z-index: 1; }
      #bar label { display: flex; gap: 4px; align-items: center; }
      #bar input[type='range'] { width: 90px; }
      button { font: inherit; padding: 2px 10px; }
      #stats { font-variant-numeric: tabular-nums; opacity: 0.8; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar">
      <label>latency <input id="latency" type="range" min="0" max="300" step="10" value="60" /><span id="latency-v"></span></label>
      <label>jitter <input id="jitter" type="range" min="0" max="100" step="5" value="10" /><span id="jitter-v"></span></label>
      <label>loss <input id="loss" type="range" min="0" max="0.3" step="0.01" value="0" /><span id="loss-v"></span></label>
      <label><input id="auto" type="checkbox" checked /> auto</label>
      <button id="drop">Drop</button>
      <button id="reset">Reset</button>
      <span id="stats"></span>
    </div>
    <script type="module" src="./net.ts"></script>
  </body>
</html>
