[package]
name = "tc-store"
description = "ThunderClap's event-log store: append-only logs with game-defined codecs, clock marks, generations, crash recovery and a directory lock"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tc-wire.workspace = true

# A plain `fsync` on Apple platforms (std's syncs are `F_FULLFSYNC` there):
# see `src/durable.rs`.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
