# The engine's Rust crates (crates/README.md): the wire format a networked
# game's server shares with its TypeScript client in src/net/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
tc-wire = { path = "crates/tc-wire" }
tc-wire-derive = { path = "crates/tc-wire-derive" }
tc-tsgen = { path = "crates/tc-tsgen" }

syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# Tests only: reading the shared vectors.
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests walk thousands of random values; opt-level 1 keeps them quick.
[profile.test]
opt-level = 1
