# The engine's Rust crates (crates/README.md): the wire format a networked
# game's server shares with its TypeScript client in src/net/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
tc-wire = { path = "crates/tc-wire" }
tc-wire-derive = { path = "crates/tc-wire-derive" }
tc-tsgen = { path = "crates/tc-tsgen" }
tc-net = { path = "crates/tc-net" }
tc-auth = { path = "crates/tc-auth" }
tc-store = { path = "crates/tc-store" }
tc-sim = { path = "crates/tc-sim" }
tc-stream = { path = "crates/tc-stream" }
tc-admin = { path = "crates/tc-admin" }
thunderclap-server = { path = "crates/thunderclap-server" }

# tc-net: the connection layer.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
tracing = "0.1"

# tc-auth: signed tokens.
hmac = "0.13"
sha2 = "0.11"

syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# JSON: tc-admin's and tc-auth's files and lines, the shared test vectors. No
# `preserve_order`: features unify, and it would reorder every dependent
# crate's `serde_json::Map`; output that needs an order writes it itself.
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests walk thousands of random values; opt-level 1 keeps them quick.
[profile.test]
opt-level = 1
